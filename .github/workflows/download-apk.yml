name: Download current test APK

on:
  push:
    branches: [work]
    paths: [.github/workflows/download-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compilation SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify content, run unit tests and build APK
        run: |
          python3 scripts/verify_content.py
          ./gradlew --no-daemon --console=plain --max-workers=3 :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare installable download
        run: |
          mkdir -p download
          cp app/build/outputs/apk/debug/app-debug.apk download/Salah-2.7.0-continuation-debug.apk
          cp docs/reports/2026-11-12/Salah-Continuation-Review.pdf download/Salah-Continuation-Review.pdf
          cd download
          sha256sum Salah-2.7.0-continuation-debug.apk Salah-Continuation-Review.pdf > SHA256SUMS.txt
      - name: Save APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: salah-continuation-apk-${{ github.sha }}
          retention-days: 90
          path: |
            download/
            app/build/reports/tests/
            app/build/test-results/
      - name: Publish a clearly labelled test download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag="continuation-apk-${GITHUB_SHA:0:12}"
          cat > download-notes.md <<'NOTES'
          Installable debug/test APK for continuation phases 5–13 on the work branch.
          This is a prerelease, not a production or store release.
          Includes scoped languages, section bookmarks, direct articles with optional guide slides, compact quick access and draft stage illustrations.
          Educational/fiqh wording is unchanged. Content review remains pending qualified scholars; artwork remains pending owner/posture review.
          Unit tests and the build are verified in this workflow; phone sensors, GPS and real audio are not verified here.
          Debug signing keys can differ between builds. If Android reports an incompatible signature, do not uninstall an existing app with saved data just to install this test.
          NOTES
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "The existing download is preserved: $release_tag"
          else
            gh release create "$release_tag" download/Salah-2.7.0-continuation-debug.apk download/Salah-Continuation-Review.pdf download/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Salah 2.7.0 — continuation test APK' --notes-file download-notes.md
          fi
          gh release view "$release_tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
