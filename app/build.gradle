apply plugin: 'com.android.application'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    namespace "com.androidhive.myapplication"
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.androidhive.myapplication"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 9
        versionName "2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets { main { assets.srcDirs = ['src/main/assets', 'src/main/assets/'] } }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AppCompat
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Design / Material Components
    implementation 'com.google.android.material:material:1.10.0'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // Support Media Compat
    implementation 'androidx.media:media:1.7.0'

    // Support v4
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // GridLayout
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.activity:activity:1.10.1'

    // Testing
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Third-party Libraries
    implementation 'com.mikhaellopez:circularimageview:4.3.0'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation 'com.github.clans:fab:1.6.4'

    // Firebase
    implementation 'com.google.firebase:firebase-messaging:23.3.1'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'

    // Google Play Services
    // Play-services-gcm has been deprecated and is now part of Firebase Cloud Messaging (FCM).
    // The base services are still needed for other Google features.
    implementation 'com.google.android.gms:play-services-base:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation 'com.batoulapps.adhan:adhan:1.2.1'

    implementation "com.google.android.material:material:1.12.0"


}
apply plugin: 'com.google.gms.google-services'
